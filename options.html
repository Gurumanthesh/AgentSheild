<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentShield Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-page">
      <section class="card">
        <p class="eyebrow">Configuration</p>
        <h1>AgentShield Settings</h1>

        <label class="field-label" for="blocked-words">Blocked keywords</label>
        <textarea id="blocked-words" rows="8" placeholder="password, secret, token"></textarea>

        <div class="actions">
          <button id="save-button" type="button">Save settings</button>
        </div>

        <p id="status-message" class="status-message" aria-live="polite"></p>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
